[theme]
font = "Noto Sans:https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
headingFont = "Noto Sans:https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
baseRadius = "0.5rem"
buttonRadius = "0.45rem"
showSidebarBorder = true
headingFontSizes = ["2rem", "1.45rem", "1.2rem", "1.05rem", "1rem", "0.9rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]

[theme.light]
primaryColor = "#24527A"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#ECEFF3"
textColor = "#1B2430"
borderColor = "#DDE1E6"
linkColor = "#24527A"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F3F6"

[theme.dark]
primaryColor = "#3A73A3"
backgroundColor = "#14181D"
secondaryBackgroundColor = "#1E252D"
textColor = "#E6E9ED"
borderColor = "#2E3740"
linkColor = "#9CC3E4"

[theme.dark.sidebar]
backgroundColor = "#191F25"
secondaryBackgroundColor = "#232B34"
